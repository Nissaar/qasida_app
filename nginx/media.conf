# Serves only the crawled scan images.
#
# Traefik sends /media/* here instead of to Django, so gunicorn's workers are
# left free to render pages. Anything else that reaches this container is a
# routing mistake and gets a 404 rather than being proxied on.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Do not advertise the nginx version.
    server_tokens off;

    location /media/ {
        # Image requests are frequent and uninteresting; keep them out of the log.
        access_log off;

        # Scans do not change once stored: a new file gets a new name rather
        # than replacing an existing one. A week is cautious enough to allow
        # for a correction being pushed out.
        expires 7d;
        add_header Cache-Control "public";

        # Only ever hand back a file that exists; never fall through.
        try_files $uri =404;
    }

    # Nothing else belongs on this container.
    location / {
        return 404;
    }
}
