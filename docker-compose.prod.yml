# Production stack, fronted by Traefik.
#
# Only the containers Traefik must reach - web and media - join the shared
# `frontend` network. Postgres and Redis sit on a network private to this
# project and are reachable from nowhere else.
#
# That division is not tidiness, it is the fix for a real outage. An earlier
# version of this file put Postgres on a second *shared* network alongside
# other stacks. A shared network is a shared DNS namespace, and `db` is the
# most collision-prone name there is: another project's `db` service claimed
# the same alias, Docker's resolver returned both addresses, and Django
# connected to whichever it happened to pick. Roughly half of all requests
# failed with "password authentication failed for user qasida_user", because
# they had reached somebody else's database. A project-private network cannot
# collide, because Compose namespaces it per project.
#
# Nothing here publishes a host port. Traefik routes to the container port over
# the frontend network, which is what `expose` declares.
#
#   docker network create frontend   # once, if it does not exist yet
#   cp .env.prod.example .env && edit it
#   docker compose -f docker-compose.prod.yml up -d --build
#
# The development docker-compose.yml is unchanged and still uses host
# networking, which suits a WSL setup but cannot work behind Traefik.

networks:
  # Private to this project. Compose prefixes it with the project name, so the
  # names `db` and `redis` here belong to this stack and nothing else.
  internal:
  frontend:
    external: true

services:
  db:
    image: postgres:15
    restart: always
    networks:
      - internal
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./db:/var/lib/postgresql/data
    # "Started" is not "ready to accept connections": Postgres runs its own
    # start-up, and on a cold volume that takes seconds. Everything that talks
    # to it waits for this to pass rather than for the container to exist.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7-alpine
    restart: always
    networks:
      - internal
    volumes:
      - ./redis:/data

  web:
    build:
      context: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - frontend
      - internal
    expose:
      - 8000
    # --access-logfile and --error-logfile pointed at stdout, so requests,
    # worker restarts and timeouts all land in `docker compose logs web`
    # alongside the application's own log. Without them gunicorn logs no
    # requests at all, and a worker being killed leaves no trace.
    command: >
      gunicorn qasida_app.wsgi:application
      --bind 0.0.0.0:8000
      --workers 3
      --timeout 120
      --access-logfile -
      --error-logfile -
      --capture-output
    entrypoint: /app/entrypoint.sh
    volumes:
      # Scanned pages live here and must outlive the container.
      - ./media:/app/media
    environment: &django_env
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS}
      # Traefik terminates TLS, so Django is told to trust the forwarded
      # scheme and to mark its cookies secure.
      DJANGO_BEHIND_PROXY: "True"
      DJANGO_SECURE_COOKIES: "True"
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: db
      DB_PORT: 5432
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      # The one message this site sends is a password reset link. Leave these
      # out and Django writes the mail to the container log instead of
      # delivering it, which means nobody can recover an account.
      DJANGO_EMAIL_BACKEND: ${DJANGO_EMAIL_BACKEND:-django.core.mail.backends.console.EmailBackend}
      DJANGO_EMAIL_HOST: ${DJANGO_EMAIL_HOST:-}
      DJANGO_EMAIL_PORT: ${DJANGO_EMAIL_PORT:-587}
      DJANGO_EMAIL_HOST_USER: ${DJANGO_EMAIL_HOST_USER:-}
      DJANGO_EMAIL_HOST_PASSWORD: ${DJANGO_EMAIL_HOST_PASSWORD:-}
      DJANGO_EMAIL_USE_TLS: ${DJANGO_EMAIL_USE_TLS:-True}
      DJANGO_EMAIL_USE_SSL: ${DJANGO_EMAIL_USE_SSL:-False}
      DJANGO_EMAIL_TIMEOUT: ${DJANGO_EMAIL_TIMEOUT:-10}
      # Mailgun, if you use it: these three alone are enough, and they take
      # precedence over the generic DJANGO_EMAIL_* variables above.
      MAILGUN_SMTP_LOGIN: ${MAILGUN_SMTP_LOGIN:-}
      MAILGUN_SMTP_PASSWORD: ${MAILGUN_SMTP_PASSWORD:-}
      MAILGUN_REGION: ${MAILGUN_REGION:-us}
      DJANGO_DEFAULT_FROM_EMAIL: ${DJANGO_DEFAULT_FROM_EMAIL:-no-reply@${SITE_HOST}}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.qasida.rule=Host(`${SITE_HOST}`)"
      - "traefik.http.routers.qasida.priority=1"
      - "traefik.http.routers.qasida.entrypoints=websecure"
      - "traefik.http.routers.qasida.tls.certresolver=leresolver"
      - "traefik.http.services.qasida.loadbalancer.server.port=8000"
      - "traefik.docker.network=frontend"

  # Scanned pages are static files, and Django holding a gunicorn worker open
  # to hand one over is wasteful. Traefik routes /media/* here instead.
  media:
    image: nginx:alpine
    restart: always
    networks:
      - frontend
    expose:
      - 80
    volumes:
      # Read-only: only the web and worker containers write scans.
      - ./media:/usr/share/nginx/html/media:ro
      - ./nginx/media.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      # A higher priority than the Django router, so /media/* is matched here
      # and everything else falls through to the app.
      - "traefik.http.routers.qasida-media.rule=Host(`${SITE_HOST}`) && PathPrefix(`/media`)"
      - "traefik.http.routers.qasida-media.priority=100"
      - "traefik.http.routers.qasida-media.entrypoints=websecure"
      - "traefik.http.routers.qasida-media.tls.certresolver=leresolver"
      - "traefik.http.services.qasida-media.loadbalancer.server.port=80"
      - "traefik.docker.network=frontend"

  celery_worker:
    build:
      context: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - internal
    command: celery -A qasida_app worker -l info --concurrency 2
    volumes:
      # The crawlers write scans, so the worker needs the same directory.
      - ./media:/app/media
    environment: *django_env
    labels:
      - "traefik.enable=false"

  celery_beat:
    build:
      context: .
    restart: always
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - internal
    # The schedule file is kept on a volume; in the container filesystem it
    # would be lost on every recreate and the schedule would drift.
    command: celery -A qasida_app beat -l info --schedule /app/beat/celerybeat-schedule
    volumes:
      - ./beat:/app/beat
    environment: *django_env
    labels:
      - "traefik.enable=false"
