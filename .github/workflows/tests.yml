name: Tests

# Every pull request, and every push to main - a merge or a direct commit.
# The server deploys by pulling main, so a failing suite has to show up
# before that pull, not after. Other branches are tested through their pull
# request; testing their pushes as well would run everything twice.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same pull request or branch supersedes the run in progress.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Enough to leave the report as a comment: on the pull request, or on the
# commit for a direct push to main.
permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    name: Run the test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The same Postgres and Redis the app runs against. Postgres rather than
    # SQLite because the search and duplicate detection lean on pg_trgm.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: qasida_db
          POSTGRES_USER: qasida_user
          POSTGRES_PASSWORD: qasida_password
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qasida_user -d qasida_db"
          --health-interval 5s --health-timeout 5s --health-retries 12
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    env:
      DJANGO_SECRET_KEY: ci-only-not-secret
      DB_HOST: localhost
      DB_PORT: '5432'
      CELERY_BROKER_URL: redis://localhost:6379/0
      CELERY_RESULT_BACKEND: redis://localhost:6379/0

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip

      # The face the PDFs are set in; one test checks it is embedded.
      - name: Install the Arabic font
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-hosny-amiri

      # Everything but argostranslate, which pulls in torch and its models and
      # is never loaded by the tests: translation is imported lazily and
      # mocked where it is exercised.
      - name: Install dependencies
        run: grep -v '^argostranslate' requirements.txt | pip install -r /dev/stdin

      # A model change without its migration would otherwise only surface as
      # a surprise folded into somebody's next migration.
      - name: Check migrations match the models
        id: migrations
        continue-on-error: true
        run: python manage.py makemigrations --check --dry-run

      # Allowed to fail here, so the report below is always written; the last
      # step fails the job if anything did.
      - name: Run the tests
        id: tests
        continue-on-error: true
        env:
          TEST_RESULTS_JSON: test-results.json
        run: python manage.py test core --noinput

      - name: Build the test report
        id: report
        if: always()
        continue-on-error: true
        run: |
          python .github/scripts/test-report.py test-results.json test-report.md "${{ steps.migrations.outcome }}"
          cat test-report.md >> "$GITHUB_STEP_SUMMARY"

      # On a pull request, one comment replaced on every push. After a merge,
      # a second comment on the merged pull request saying how main fared.
      # For a direct push to main, a comment on the commit. Pull requests
      # from forks get a read-only token, so they are left to the job summary.
      - name: Report back
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const run = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const report = fs.existsSync('test-report.md')
              ? fs.readFileSync('test-report.md', 'utf8')
              : '## 📜 Qasida Library — test report\n\n> ❌ The report could not be generated. Check the job log.\n';
            const sha = context.sha.slice(0, 7);

            async function upsert(issue_number, marker, where) {
              const body = `${marker}\n${report}\n---\n<sub>${where} \`${sha}\` · [full log](${run})</sub>`;
              const comments = await github.paginate(github.rest.issues.listComments,
                { owner, repo, issue_number, per_page: 100 });
              const existing = comments.find(c => c.body && c.body.startsWith(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            }

            if (context.eventName === 'pull_request') {
              await upsert(context.issue.number, '<!-- test-report:pr -->', 'Latest run on');
              return;
            }
            const { data: pulls } = await github.rest.repos.listPullRequestsAssociatedWithCommit(
              { owner, repo, commit_sha: context.sha });
            const merged = pulls.find(p => p.merged_at);
            if (merged) {
              await upsert(merged.number, '<!-- test-report:main -->', 'After merging, main at');
            } else {
              await github.rest.repos.createCommitComment({ owner, repo, commit_sha: context.sha,
                body: `${report}\n---\n<sub>Pushed to main · [full log](${run})</sub>` });
            }

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results-${{ github.run_id }}
          path: |
            test-results.json
            test-report.md
          retention-days: 30
          if-no-files-found: ignore

      # The report is published first, so a failure still leaves a readable
      # account of it on the pull request and on the run.
      - name: Fail if anything failed
        if: always() && (steps.tests.outcome == 'failure' || steps.migrations.outcome == 'failure')
        run: |
          echo "One or more checks failed - see the report on the run summary or the pull request."
          exit 1
