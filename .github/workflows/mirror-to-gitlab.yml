name: Mirror to GitLab

on:
  push:
    branches: ['**']
    tags: ['**']
  delete:
  workflow_dispatch:

concurrency:
  group: mirror-to-gitlab
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Mirror all branches and tags to GitLab
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GITLAB_PROJECT: ${{ vars.GITLAB_PROJECT }}
        run: |
          set -euo pipefail
          if [ -z "${GITLAB_TOKEN:-}" ] || [ -z "${GITLAB_PROJECT:-}" ]; then
            echo "::error::GITLAB_TOKEN secret or GITLAB_PROJECT variable is not set"
            exit 1
          fi
          git clone --mirror \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            source.git
          cd source.git
          git push --prune \
            "https://oauth2:${GITLAB_TOKEN}@gitlab.com/${GITLAB_PROJECT}.git" \
            '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'
